<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nial-Tech Infrastructure</title>
  <desc id="desc">Logo Nial-Tech Infrastructure, monogramme NT bleu et anthracite avec symbole réseau et serveurs.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#168cff"/><stop offset="1" stop-color="#123fce"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#354253"/><stop offset="1" stop-color="#151c28"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="15" result="blur"/><feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.34  0 0 0 0 1  0 0 0 .6 0" result="blueGlow"/><feMerge><feMergeNode in="blueGlow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Monogramme NT angulaire -->
  <g stroke="#111827" stroke-width="2" stroke-linejoin="round">
    <path d="M258 150 L258 390 L307 390 L307 250 L488 390 L534 359 Z" fill="url(#blue)" filter="url(#glow)"/>
    <path d="M352 151 L610 151 L610 203 L526 203 L526 345 L478 308 L478 203 L405 203 Z" fill="url(#dark)"/>
    <path d="M258 412 H307 V461 H258 Z" fill="url(#blue)"/>
  </g>
  <!-- Réseau et infrastructure serveur -->
  <g fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M658 248 H704 V306 H658 M681 306 V335 M658 335 H704"/>
    <path d="M704 277 H738 M681 335 V357"/>
  </g>
  <g fill="url(#dark)" stroke="#111827" stroke-width="2">
    <rect x="716" y="238" width="70" height="34" rx="7"/>
    <rect x="716" y="284" width="70" height="34" rx="7"/>
    <rect x="716" y="330" width="70" height="34" rx="7"/>
  </g>
  <g fill="#168cff">
    <circle cx="730" cy="255" r="4"/><circle cx="730" cy="301" r="4"/><circle cx="730" cy="347" r="4"/>
    <circle cx="772" cy="255" r="3"/><circle cx="772" cy="301" r="3"/><circle cx="772" cy="347" r="3"/>
    <circle cx="738" cy="277" r="6"/><circle cx="681" cy="357" r="6"/>
  </g>
  <!-- Nom -->
  <text x="512" y="584" text-anchor="middle" font-family="Orbitron, Eurostile, Arial, sans-serif" font-size="76" font-weight="500" letter-spacing="12" fill="url(#dark)" stroke="#111827" stroke-width="1">NIAL-<tspan fill="url(#blue)" stroke="#123fce">TECH</tspan></text>
  <path d="M300 633 H724" stroke="#168cff" stroke-width="3" opacity=".8"/>
  <text x="512" y="694" text-anchor="middle" font-family="Orbitron, Eurostile, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="12" fill="url(#blue)">INFRASTRUCTURE</text>
  <text x="512" y="752" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="10" fill="#222a35">NIAL-TECH.COM</text>
</svg>
