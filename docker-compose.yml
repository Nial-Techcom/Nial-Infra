# Nial-Infra: PostgreSQL + API + web UI (nginx). Web, desktop and mobile apps all talk to the same API.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nial_infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nial_infra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  server:
    image: ghcr.io/nial-techcom/nial-infra-server:latest
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nial_infra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nial_infra}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-3000}}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://lcsinfra.nial-tech.com}
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop: [ALL]            # le serveur Node n'a besoin d'aucun privilège Linux
    read_only: true            # le serveur n'écrit rien sur son disque
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  web:
    image: ghcr.io/nial-techcom/nial-infra-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - server
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
