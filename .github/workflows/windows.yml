name: Windows installers
on:
  push:
    branches: [windows]
    tags: ['windows-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version à publier (ex. 1.1.1) : construit puis crée la release avec les fichiers. Vide = construire seulement.'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Build shared package
        run: npm run build:shared
      - name: Build web UI and stage it for Electron
        run: npm run build -w @infra-tech/desktop
      - name: Build .exe (NSIS) and .msi
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Infra-Tech-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && format('windows-v{0}', inputs.release_tag) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
