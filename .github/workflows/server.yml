name: Server (Docker images)
on:
  push:
    branches: [server]
    tags: ['server-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version à publier (ex. 1.1.1) : construit puis crée la release avec les fichiers. Vide = construire seulement.'
        required: false
        default: ''
permissions:
  contents: write
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: netforge-server
            dockerfile: apps/server/Dockerfile
          - name: netforge-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/flunch4456/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=match,pattern=server-v(.*),group=1
      # amd64 for PCs/servers/Proxmox, arm64 for Raspberry Pi and ARM boards
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  bundle:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack deployment bundle
        run: tar czf netforge-server-bundle.tar.gz docker-compose.yml .env.example docs/TUTORIAL.md README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && format('server-v{0}', inputs.release_tag) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: netforge-server-bundle.tar.gz
